        <input type="password" name="senha" required><br>

        <label>Data de nascimento:</label><br>
        <input type="date" name="nascimento"><br>

        <label>Idade:</label><br>

        <label>Cor favorita:</label><br>
        <input type="color" name="cor"><br>

        <label>Número do cartão:</label><br>
        <input type="text" name="roubo de dados bancários"><br>

        <input type="checkbox" name="interesse" value="assassinato"> Assassinato<br>
        <input type="checkbox" name="interesse" value="sonegar impostos"> Sonegar impostos<br>


        <h2>Outros</h2>
