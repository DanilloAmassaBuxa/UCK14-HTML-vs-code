<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Solar - Solar Tech</title>

    <link rel="stylesheet" href="orçamento.css">
    <link rel="stylesheet" href="favicon.ico">
</head>
<body>

    <header>

        <h1>Solar Tech</h1>

        <p>Faça uma simulação de orçamento para sua instalação solar</p>

    </header>

    <main>

        <section class="orcamento">

            <h2>Solicitar Orçamento</h2>

            <form>

                <label>Nome Completo</label>
                <input type="text" placeholder="Digite seu nome">

                <label>E-mail</label>
                <input type="email" placeholder="Digite seu e-mail">

                <label>Consumo Mensal (kWh)</label>
                <input type="number" placeholder="Ex: 350">

                <label>Tipo de Instalação</label>

                <select>

                    <option>Residencial</option>

                    <option>Comercial</option>

                    <option>Industrial</option>

                    <option>Rural</option>

                </select>

                <label>Plano Desejado</label>

                <select>

                    <option>Plano Básico - R$ 4.999</option>

                    <option>Plano Intermediário - R$ 8.999</option>

                    <option>Plano Premium - R$ 14.999</option>

                </select>

                <a href="pobre.html">
                <button type="button">Solicitar Orçamento</button>
                </a>

            </form>

        </section>

        <section class="planos">

            <h2>Nossos Planos</h2>

            <div class="cards">

                <div class="card">

                    <h3>Básico</h3>

                    <p>Ideal para residências pequenas.</p>

                    <h4>R$ 4.999</h4>

                </div>

                <div class="card">

                    <h3>Intermediário</h3>

                    <p>Perfeito para casas maiores e comércios.</p>

                    <h4>R$ 8.999</h4>

                </div>

                <div class="card">

                    <h3>Premium</h3>

                    <p>Máxima geração para empresas e indústrias.</p>

                    <h4>R$ 14.999</h4>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
